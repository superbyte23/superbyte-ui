<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Superbyte UI — Welcome back</title>
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="vendor/bootstrap/css/bootstrap.min.css">
<link rel="stylesheet" href="vendor/hugeicons/css/hugeicons-used.css">
<link rel="stylesheet" href="vendor/fonts.css">
<link rel="stylesheet" href="vendor/fonts/theme-fonts.css">
<link rel="stylesheet" href="assets/css/app.css">
<link rel="stylesheet" href="assets/css/layout-modes.css">
<script src="assets/js/theme-bootstrap.js"></script>

</head>
<body data-bs-theme="dark">

<!-- ═══ TOAST CONTAINER ═══════════════════════════════════════════════════ -->
<div id="toast-container"></div>

<!-- ═══ AUTH PAGE ═════════════════════════════════════════════════════════ -->
<div class="auth-page">
  <div class="auth-card">

    <div class="auth-logo">
      <div class="logo-mark"><i class="hgi-stroke hgi-flowchart-01"></i></div>
      Superbyte UI
      <span style="color:var(--text3);font-weight:400;font-size:11px">v2.4.0</span>
    </div>

    <button class="icon-btn auth-theme-btn" onclick="toggleTheme()" title="Toggle theme"><i class="hgi-stroke hgi-moon-01" id="theme-icon"></i></button>

    <div class="auth-panel">
      <div class="auth-shield "><i class="hgi-stroke hgi-login-01"></i></div>
      <h1>Welcome back</h1>
      <p class="sub">Sign in to your Superbyte UI account to continue.</p>

      <form id="auth-form" novalidate>
  <div class="mb-3">
    <label class="form-label" for="login-email">Email address</label>
    <input class="form-control" type="email" id="login-email" placeholder="you@example.com" required autofocus>
  </div>
  <div class="mb-3">
    <div class="d-flex justify-content-between">
      <label class="form-label" for="login-pass">Password</label>
      <a href="forgot.html" style="font-size:11.5px;color:var(--accent-h)">Forgot password?</a>
    </div>
    <input class="form-control" type="password" id="login-pass" placeholder="Password" required>
  </div>
  <div class="form-check mb-3">
    <input class="form-check-input" type="checkbox" id="remember" checked>
    <label class="form-check-label" for="remember" style="font-size:12.5px">Remember me</label>
  </div>
  <button class="btn btn-primary w-100" type="submit">Sign in <i class="hgi-stroke hgi-arrow-right-01 ms-1"></i></button>
</form>

    </div>

    <div class="auth-foot">Don't have an account? <a href="register.html">Sign up</a></div>
    <div class="auth-legal">© 2026 Superbyte UI · <a href="#" onclick="showToast('success','Demo only')">Terms</a> · <a href="#" onclick="showToast('success','Demo only')">Privacy</a></div>

  </div>
</div>

<footer class="app-footer auth-page-footer">
  <div class="app-footer-inner d-flex flex-wrap align-items-center justify-content-center justify-content-md-between">
    <div class="footer-meta"><span class="plan-tag"><span class="status-dot on"></span>v2.5.0</span><span class="footer-status"><span class="status-dot on"></span>System online · 99.9% uptime</span></div>
    <div class="footer-storage"><div class="fs-label"><span>Storage</span><span>6.2 GB of 10 GB</span></div><div class="progress"><div class="progress-bar" style="width:62%"></div></div></div>
    <div class="footer-links"><a href="docs.html">Docs</a><a href="#">Support</a><a href="#">Changelog</a></div>
    <div class="footer-copy">© 2026 Superbyte UI</div>
  </div>
</footer>
<script src="vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
<script>
/* ══════════════════════════════════════════════════════════════════════════
   Auth page handlers — inlined verbatim into every generated auth page.
   Demo only: fake validation, no real request is ever sent.
   ══════════════════════════════════════════════════════════════════════════ */
(function () {
  function toastOk(msg) { showToast('success', msg); }
  function toastErr(msg) { showToast('error', msg); }

  function setValidity(input, ok) {
    input.classList.toggle('is-invalid', !ok);
  }

  const form = document.getElementById('auth-form');
  if (form) {
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      let ok = true;
      form.querySelectorAll('input[required]').forEach(function (inp) {
        const v = inp.value.trim();
        const good = v !== '' && (inp.type !== 'email' || /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v));
        setValidity(inp, good);
        if (!good) ok = false;
      });
      const p1 = document.getElementById('reg-pass');
      const p2 = document.getElementById('reg-cfpass');
      if (p1 && p2 && p1.value !== p2.value) { setValidity(p2, false); ok = false; }
      const otp = form.querySelectorAll('.otp-box');
      if (otp.length) {
        const filled = Array.prototype.every.call(otp, function (b) { return b.value.trim() !== ''; });
        otp.forEach(function (b) { setValidity(b, filled); });
        if (!filled) ok = false;
      }
      if (ok) toastOk('All good — this is a demo, no request was sent.');
      else toastErr('Please fix the highlighted fields.');
    });
  }

  const otpBoxes = document.querySelectorAll('.otp-box');
  otpBoxes.forEach(function (box, i, arr) {
    box.addEventListener('input', function () {
      box.value = box.value.replace(/\D/g, '').slice(0, 1);
      if (box.value && arr[i + 1]) arr[i + 1].focus();
    });
    box.addEventListener('keydown', function (e) {
      if (e.key === 'Backspace' && !box.value && arr[i - 1]) arr[i - 1].focus();
    });
    box.addEventListener('paste', function (e) {
      e.preventDefault();
      const digits = (e.clipboardData.getData('text') || '').replace(/\D/g, '').slice(0, arr.length);
      arr.forEach(function (b, j) { b.value = digits[j] || ''; });
      arr[Math.min(digits.length, arr.length - 1)].focus();
    });
  });

  function armResend(btn) {
    let n = 30;
    const label = btn.dataset.resend || btn.textContent;
    btn.disabled = true;
    btn.innerHTML = label + ' (' + n + 's)';
    toastOk(label + ' — check your inbox');
    const t = setInterval(function () {
      n--;
      btn.innerHTML = label + ' (' + n + 's)';
      if (n <= 0) {
        clearInterval(t);
        btn.disabled = false;
        btn.innerHTML = label;
      }
    }, 1000);
  }
  document.querySelectorAll('[data-resend]').forEach(function (btn) {
    btn.addEventListener('click', function () { armResend(btn); });
  });
  document.querySelectorAll('.resend-link').forEach(function (el) {
    el.addEventListener('click', function () { toastOk('A new code was sent to your device'); });
  });
})();

</script>
<script src="assets/js/app.js"></script>
</body>
</html>
