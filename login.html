<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Superbyte — Welcome back</title>
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="vendor/bootstrap/css/bootstrap.min.css">
<link rel="stylesheet" href="vendor/hugeicons/css/hugeicons-used.css">
<link rel="stylesheet" href="vendor/fonts.css">
<link rel="stylesheet" href="vendor/fonts/theme-fonts.css">
<link rel="stylesheet" href="assets/css/app.css">
<!-- sb-theme-bootstrap -->
<script>
(function () {
  try {
    var L = localStorage, m = {};
    m.mode = L.getItem('grid_admin_theme');
    m.accent = L.getItem('grid_admin_accent');
    m.base = L.getItem('grid_admin_basetheme');
    m.font = L.getItem('grid_admin_font');
    m.radius = L.getItem('grid_admin_radius');
    m.fs = L.getItem('grid_admin_fontsize');
    m.compact = L.getItem('grid_admin_compact');
    m.boxed = L.getItem('grid_admin_boxed');
    var THEMES = {"indigo":{"name":"Indigo","base":"#6366f1","hi":"#818cf8","rgb":"99,102,241"},"violet":{"name":"Violet","base":"#8b5cf6","hi":"#a78bfa","rgb":"139,92,246"},"fuchsia":{"name":"Fuchsia","base":"#d946ef","hi":"#e879f9","rgb":"217,70,239"},"pink":{"name":"Pink","base":"#ec4899","hi":"#f472b6","rgb":"236,72,153"},"rose":{"name":"Rose","base":"#f43f5e","hi":"#fb7185","rgb":"244,63,94"},"red":{"name":"Red","base":"#ef4444","hi":"#f87171","rgb":"239,68,68"},"orange":{"name":"Orange","base":"#f97316","hi":"#fb923c","rgb":"249,115,22"},"amber":{"name":"Amber","base":"#f59e0b","hi":"#fbbf24","rgb":"245,158,11"},"yellow":{"name":"Yellow","base":"#eab308","hi":"#facc15","rgb":"234,179,8"},"lime":{"name":"Lime","base":"#84cc16","hi":"#a3e635","rgb":"132,204,22"},"green":{"name":"Green","base":"#22c55e","hi":"#4ade80","rgb":"34,197,94"},"emerald":{"name":"Emerald","base":"#10b981","hi":"#34d399","rgb":"16,185,129"},"teal":{"name":"Teal","base":"#14b8a6","hi":"#2dd4bf","rgb":"20,184,166"},"cyan":{"name":"Cyan","base":"#06b6d4","hi":"#22d3ee","rgb":"6,182,212"},"sky":{"name":"Sky","base":"#0ea5e9","hi":"#38bdf8","rgb":"14,165,233"},"blue":{"name":"Blue","base":"#3b82f6","hi":"#60a5fa","rgb":"59,130,246"},"purple":{"name":"Purple","base":"#a855f7","hi":"#c084fc","rgb":"168,85,247"}};
    var FONTS = {"ubuntu":{"name":"Ubuntu","stack":"'Ubuntu', sans-serif"},"inter":{"name":"Inter","stack":"'Inter', 'Ubuntu', sans-serif"},"notosans":{"name":"Noto Sans","stack":"'Noto Sans', 'Ubuntu', sans-serif"},"nunitosans":{"name":"Nunito Sans","stack":"'Nunito Sans', 'Ubuntu', sans-serif"},"figtree":{"name":"Figtree","stack":"'Figtree', 'Ubuntu', sans-serif"},"roboto":{"name":"Roboto","stack":"'Roboto', 'Ubuntu', sans-serif"},"raleway":{"name":"Raleway","stack":"'Raleway', 'Ubuntu', sans-serif"},"dmsans":{"name":"DM Sans","stack":"'DM Sans', 'Ubuntu', sans-serif"},"publicsans":{"name":"Public Sans","stack":"'Public Sans', 'Ubuntu', sans-serif"},"outfit":{"name":"Outfit","stack":"'Outfit', 'Ubuntu', sans-serif"},"oxanium":{"name":"Oxanium","stack":"'Oxanium', 'Ubuntu', sans-serif"},"manrope":{"name":"Manrope","stack":"'Manrope', 'Ubuntu', sans-serif"},"spacegrotesk":{"name":"Space Grotesk","stack":"'Space Grotesk', 'Ubuntu', sans-serif"},"montserrat":{"name":"Montserrat","stack":"'Montserrat', 'Ubuntu', sans-serif"},"ibmplexsans":{"name":"IBM Plex Sans","stack":"'IBM Plex Sans', 'Ubuntu', sans-serif"},"sourcesans3":{"name":"Source Sans 3","stack":"'Source Sans 3', 'Ubuntu', sans-serif"},"instrumentsans":{"name":"Instrument Sans","stack":"'Instrument Sans', 'Ubuntu', sans-serif"}};
    var R = { '4px': ['4px', '2px'], '8px': ['8px', '4px'], '14px': ['14px', '8px'] };
    var t, hl = document.documentElement.style;
    if (m.fs) hl.fontSize = Math.min(17, Math.max(13, parseInt(m.fs, 10))) + 'px';
    if (m.font && FONTS[m.font]) hl.setProperty('--sans', FONTS[m.font].stack);
    if (m.accent && (t = THEMES[m.accent])) {
      hl.setProperty('--accent', t.base); hl.setProperty('--accent-h', t.hi);
      hl.setProperty('--bs-primary', t.base); hl.setProperty('--bs-primary-rgb', t.rgb);
    }
    if (m.radius && R[m.radius]) {
      var p = R[m.radius];
      hl.setProperty('--radius', p[0]); hl.setProperty('--radius-sm', p[1]);
      hl.setProperty('--bs-border-radius', p[0]); hl.setProperty('--bs-border-radius-sm', p[1]);
    }
    function applyBody() {
      var b = document.body, bs = b.style, mode = (m.mode === 'light' || m.mode === 'dark') ? m.mode : null;
      if (mode) b.setAttribute('data-bs-theme', mode);
      if (m.base && m.base !== 'neutral') b.setAttribute('data-base-theme', m.base);
      if (m.compact === '1') b.classList.add('layout-compact');
      if (m.boxed === '1') b.classList.add('layout-boxed');
      var light = (mode || 'dark') === 'light';
      if (m.accent && (t = THEMES[m.accent])) {
        bs.setProperty('--accent', t.base); bs.setProperty('--accent-h', t.hi);
        bs.setProperty('--accent-bg', 'rgba(' + t.rgb + ',' + (light ? '.08' : '.12') + ')');
        bs.setProperty('--bs-primary', t.base); bs.setProperty('--bs-primary-rgb', t.rgb);
      }
      if (m.font && FONTS[m.font]) bs.setProperty('--sans', FONTS[m.font].stack);
      if (m.radius && R[m.radius]) {
        var q = R[m.radius];
        bs.setProperty('--radius', q[0]); bs.setProperty('--radius-sm', q[1]);
        bs.setProperty('--bs-border-radius', q[0]); bs.setProperty('--bs-border-radius-sm', q[1]);
      }
    }
    if (document.body) applyBody();
    else {
      var mo = new MutationObserver(function () { if (document.body) { mo.disconnect(); applyBody(); } });
      mo.observe(document.documentElement, { childList: true });
      document.addEventListener('DOMContentLoaded', applyBody);
    }
  } catch (e) {}
})();
</script>

</head>
<body data-bs-theme="dark">

<!-- ═══ TOAST CONTAINER ═══════════════════════════════════════════════════ -->
<div id="toast-container"></div>

<!-- ═══ AUTH PAGE ═════════════════════════════════════════════════════════ -->
<div class="auth-page">
  <div class="auth-card">

    <div class="auth-logo">
      <div class="logo-mark"><i class="hgi-stroke hgi-flowchart-01"></i></div>
      Superbyte
      <span style="color:var(--text3);font-weight:400;font-size:11px">v2.4.0</span>
    </div>

    <button class="icon-btn auth-theme-btn" onclick="toggleTheme()" title="Toggle theme"><i class="hgi-stroke hgi-moon-01" id="theme-icon"></i></button>

    <div class="auth-panel">
      <div class="auth-shield "><i class="hgi-stroke hgi-login-01"></i></div>
      <h1>Welcome back</h1>
      <p class="sub">Sign in to your Superbyte account to continue.</p>

      <form id="auth-form" novalidate>
  <div class="mb-3">
    <label class="form-label" for="login-email">Email address</label>
    <input class="form-control" type="email" id="login-email" placeholder="you@example.com" required autofocus>
  </div>
  <div class="mb-3">
    <div class="d-flex justify-content-between">
      <label class="form-label" for="login-pass">Password</label>
      <a href="forgot.html" style="font-size:11.5px;color:var(--accent-h)">Forgot password?</a>
    </div>
    <input class="form-control" type="password" id="login-pass" placeholder="Password" required>
  </div>
  <div class="form-check mb-3">
    <input class="form-check-input" type="checkbox" id="remember" checked>
    <label class="form-check-label" for="remember" style="font-size:12.5px">Remember me</label>
  </div>
  <button class="btn btn-primary w-100" type="submit">Sign in <i class="hgi-stroke hgi-arrow-right-01 ms-1"></i></button>
</form>

    </div>

    <div class="auth-foot">Don't have an account? <a href="register.html">Sign up</a></div>
    <div class="auth-legal">© 2026 Superbyte Admin · <a href="#" onclick="showToast('success','Demo only')">Terms</a> · <a href="#" onclick="showToast('success','Demo only')">Privacy</a></div>

  </div>
</div>

<script src="vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
<script>
/* ══════════════════════════════════════════════════════════════════════════
   Auth page handlers — inlined verbatim into every generated auth page.
   Demo only: fake validation, no real request is ever sent.
   ══════════════════════════════════════════════════════════════════════════ */
(function () {
  function toastOk(msg) { showToast('success', msg); }
  function toastErr(msg) { showToast('error', msg); }

  function setValidity(input, ok) {
    input.classList.toggle('is-invalid', !ok);
  }

  const form = document.getElementById('auth-form');
  if (form) {
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      let ok = true;
      form.querySelectorAll('input[required]').forEach(function (inp) {
        const v = inp.value.trim();
        const good = v !== '' && (inp.type !== 'email' || /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v));
        setValidity(inp, good);
        if (!good) ok = false;
      });
      const p1 = document.getElementById('reg-pass');
      const p2 = document.getElementById('reg-cfpass');
      if (p1 && p2 && p1.value !== p2.value) { setValidity(p2, false); ok = false; }
      const otp = form.querySelectorAll('.otp-box');
      if (otp.length) {
        const filled = Array.prototype.every.call(otp, function (b) { return b.value.trim() !== ''; });
        otp.forEach(function (b) { setValidity(b, filled); });
        if (!filled) ok = false;
      }
      if (ok) toastOk('All good — this is a demo, no request was sent.');
      else toastErr('Please fix the highlighted fields.');
    });
  }

  const otpBoxes = document.querySelectorAll('.otp-box');
  otpBoxes.forEach(function (box, i, arr) {
    box.addEventListener('input', function () {
      box.value = box.value.replace(/\D/g, '').slice(0, 1);
      if (box.value && arr[i + 1]) arr[i + 1].focus();
    });
    box.addEventListener('keydown', function (e) {
      if (e.key === 'Backspace' && !box.value && arr[i - 1]) arr[i - 1].focus();
    });
    box.addEventListener('paste', function (e) {
      e.preventDefault();
      const digits = (e.clipboardData.getData('text') || '').replace(/\D/g, '').slice(0, arr.length);
      arr.forEach(function (b, j) { b.value = digits[j] || ''; });
      arr[Math.min(digits.length, arr.length - 1)].focus();
    });
  });

  function armResend(btn) {
    let n = 30;
    const label = btn.dataset.resend || btn.textContent;
    btn.disabled = true;
    btn.innerHTML = label + ' (' + n + 's)';
    toastOk(label + ' — check your inbox');
    const t = setInterval(function () {
      n--;
      btn.innerHTML = label + ' (' + n + 's)';
      if (n <= 0) {
        clearInterval(t);
        btn.disabled = false;
        btn.innerHTML = label;
      }
    }, 1000);
  }
  document.querySelectorAll('[data-resend]').forEach(function (btn) {
    btn.addEventListener('click', function () { armResend(btn); });
  });
  document.querySelectorAll('.resend-link').forEach(function (el) {
    el.addEventListener('click', function () { toastOk('A new code was sent to your device'); });
  });
})();

</script>
<script src="assets/js/app.js"></script>
</body>
</html>
